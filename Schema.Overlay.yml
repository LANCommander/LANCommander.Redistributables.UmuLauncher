# The entire option schema for umu-launcher, written by hand.
#
# Unusually, this is not curation layered over a parsed config. umu-launcher reads
# no configuration file, so ConfigPaths is empty and there is nothing generated to
# curate. Every entry below declares a Type, which is what makes Merge-SchemaOverlay
# materialise it as an option in its own right rather than reporting it as stale
# curation.
#
# Three rules matter more here than anywhere else:
#
#   1. The leaf key IS the environment variable name. ProcessExecutionContext takes
#      the last dot-segment of the flattened key, so Proton.PROTONPATH sets
#      PROTONPATH. Renaming a key renames the variable, and two keys sharing a last
#      segment would fight over one variable -- Test-OptionSchema rejects that.
#   2. An empty value is never set at all; ApplyCompatibilityOptions skips it. That
#      is deliberate wherever there is no Default below. umu's own fallback is
#      better than anything we could guess, and for WINEPREFIX an explicitly empty
#      value is a fatal error inside umu itself.
#   3. Everything numeric is quoted. OptionDefinition.Default is object and
#      GetDefaultAsString() calls ToString(), so an unquoted 0 or true would reach
#      umu as .NET's "0" or "True" rather than what it compares against.

# The template is split on its FIRST SPACE: everything before becomes the process
# filename, everything after becomes the argument string. That rules out leading
# with {InstallDir}, because game directories routinely contain spaces ("Age of
# Empires II"). Leading with python3 keeps the filename a single bare token that
# .NET resolves from PATH, and the zipapp path stays a quoted argument.
#
# Invoking the interpreter rather than relying on the zipapp's shebang also makes a
# missing Python fail as "python3 not found" rather than a bare ENOEXEC.
#
# The GUID is this redistributable's own Id from redistributable.yml. The launcher
# has no variable for a redistributable's metadata directory, so it is written out.
CommandTemplate: 'python3 "{InstallDir}/.lancommander/ad007430-53e6-4f3c-a91b-a91dc54a10b9/Files/umu-run" "{exe}" {args}'

# The guest platform this shim bridges onto a Linux host. CompatibilityResolver
# .GetBridge needs both this and a CommandTemplate before it will offer a
# Windows-only action to a Linux client.
GuestPlatforms: Windows

DisplayName: Proton (umu)

Groups:
  Game:
    DisplayName: Game Identity
    Description: How umu identifies this game when it looks up per-game Proton fixes.
    Include:
      - GAMEID
      - STORE
      - WINEPREFIX

  Proton:
    Description: Which Proton build runs the game, and how it is invoked.
    Include:
      - PROTONPATH
      - PROTON_VERB

  Runtime:
    Description: Steam Linux Runtime downloads and update behaviour.
    Include:
      - UMU_RUNTIME_UPDATE
      - UMU_HTTP_TIMEOUT
      - UMU_HTTP_RETRIES

  Diagnostics:
    Include:
      - UMU_LOG

Options:
  GAMEID:
    Type: string
    DisplayName: umu Game ID
    Description: >
      Identifier umu uses to find per-game Proton fixes in its games database, for
      example umu-1091500. Leave it at umu-default for a game with no entry; a
      wrong id only means the wrong fixes are applied.
    Default: umu-default
    IsEnvironmentVariable: true

  STORE:
    Type: choice
    DisplayName: Store
    Description: >
      Which storefront this copy came from. Only meaningful alongside a real umu
      Game ID, since the two together are what identify a title in the umu games
      database. Leave it empty for anything else.
    IsEnvironmentVariable: true
    Choices:
      - { Value: 'egs', DisplayName: 'Epic Games Store' }
      - { Value: 'gog', DisplayName: 'GOG' }
      - { Value: 'battlenet', DisplayName: 'Battle.net' }
      - { Value: 'amazon', DisplayName: 'Amazon Games' }
      - { Value: 'humble', DisplayName: 'Humble Bundle' }
      - { Value: 'itchio', DisplayName: 'itch.io' }
      - { Value: 'ubisoft', DisplayName: 'Ubisoft Connect' }

  WINEPREFIX:
    Type: string
    DisplayName: Wine Prefix
    Description: >
      Directory holding the game's virtual Windows install: its registry, installed
      runtimes and anything it writes to its own C: drive. {InstallDir} is expanded
      at launch, so the default keeps one prefix per game inside the game's own
      directory, where the Uninstall script can clean it up again. Point several
      games at one path to share a prefix. Never blank it deliberately -- umu
      treats an explicitly empty prefix as a fatal error.
    Default: '{InstallDir}/.umu'
    IsEnvironmentVariable: true

  PROTONPATH:
    Type: string
    DisplayName: Proton Build
    Description: >
      Absolute path to a Proton build, a version name such as GE-Proton9-5, or a
      codename such as GE-Proton or UMU-Proton for the latest of that line. Leave it
      empty and umu downloads and uses the newest UMU-Proton, which is the right
      answer for almost every game.
    IsEnvironmentVariable: true

  PROTON_VERB:
    Type: choice
    DisplayName: Proton Verb
    Description: >
      How Proton starts the executable. waitforexitandrun waits for any previous
      process in the prefix to exit first, and is what Steam itself uses. run skips
      that wait. runinprefix runs the executable inside the prefix without Proton's
      wrapper, which suits small helper programs. umu also accepts destroyprefix,
      getcompatpath and getnativepath, which are maintenance verbs that never launch
      a game and so are not offered here.
    Default: waitforexitandrun
    IsEnvironmentVariable: true
    Choices: [waitforexitandrun, run, runinprefix]

  UMU_RUNTIME_UPDATE:
    Type: choice
    DisplayName: Update the Runtime
    Description: >
      Whether umu checks for a newer Steam Linux Runtime on each launch. Turn it off
      for a LAN party on a poor connection, or to pin every client to the runtime
      they already have.
    Default: "1"
    IsEnvironmentVariable: true
    Choices:
      - { Value: '1', DisplayName: 'Update automatically' }
      - { Value: '0', DisplayName: 'Never update' }

  UMU_HTTP_TIMEOUT:
    Type: int
    DisplayName: Download Timeout
    Description: >
      Seconds umu waits on each HTTP request while fetching the runtime or a Proton
      build. 0 removes the timeout entirely, which means a dead mirror hangs the
      launch rather than failing it -- lower it instead of disabling it.
    Default: "5"
    IsEnvironmentVariable: true

  UMU_HTTP_RETRIES:
    Type: int
    DisplayName: Download Retries
    Description: >
      How many times umu retries a failed download. 0 disables retrying, which makes
      a launch with no internet fail immediately instead of stalling.
    Default: "3"
    IsEnvironmentVariable: true

  UMU_LOG:
    Type: choice
    DisplayName: Logging
    Description: >
      umu's own logging, written to the client log. Turn it on when a game will not
      start; Debug additionally logs the resolved environment and the exact Proton
      command line.
    Default: "0"
    IsEnvironmentVariable: true
    Choices:
      - { Value: '0', DisplayName: 'Off' }
      - { Value: '1', DisplayName: 'On' }
      - { Value: 'debug', DisplayName: 'Debug' }

# UMU_NO_PROTON is deliberately not exposed, and this note is here so nobody adds it
# back. It runs the executable without Proton at all, which defeats the point of
# this shim, and it cannot be exposed safely: umu tests it with
#   os.environ.get("UMU_NO_PROTON") != "1"
# in one place but with bare truthiness in another, and "0" is truthy in Python. An
# administrator switching it "off" would switch it on. There is no value we could
# ship as an off state that is safe in both checks.
